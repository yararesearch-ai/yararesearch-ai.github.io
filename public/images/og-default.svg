<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#090B10"/>
  
  <!-- Subtle background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5B9CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Brand icon -->
  <g transform="translate(100, 120)">
    <rect width="64" height="64" rx="12" fill="#101522" stroke="rgba(91, 156, 255, 0.3)" stroke-width="2"/>
    <path d="M18 16L32 34M46 16L32 34M32 34V48" stroke="#5B9CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="14" r="4" fill="#56D9E8"/>
  </g>
  
  <!-- Metadata pill -->
  <text x="100" y="240" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#5B9CFF" letter-spacing="0.12em">YR · INDEPENDENT AI RESEARCH &amp; ENGINEERING</text>
  
  <!-- Headline -->
  <text x="100" y="320" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" fill="#F4F6FA" letter-spacing="-0.03em">The Intelligence Frontier</text>
  
  <!-- Tagline -->
  <text x="100" y="380" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="400" fill="#A0A9BA">Exploring the foundations and future of intelligent systems.</text>
  
  <!-- Bottom metadata bar -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="100" y="540" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#687386">yararesearch.com</text>
  <text x="960" y="540" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#687386">EST. 2026 · GLOBAL</text>
</svg>
