<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" fill="none" role="img" aria-labelledby="titleDark">
  <title id="titleDark">YARA Research Logo (Dark Theme)</title>
  <defs>
    <linearGradient id="edgeDarkL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#5B9CFF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="yLightFacetL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="45%" stop-color="#5B9CFF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="yDeepFacetL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9CFF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <radialGradient id="nodeDarkL" cx="34%" cy="28%" r="72%">
