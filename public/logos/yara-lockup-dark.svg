    <g stroke="#BAE6FD" stroke-opacity="0.4" stroke-width="1" stroke-linejoin="round">
      <polygon points="256,256 256,231.75 154.8,173.3 131.3,184" fill="url(#yLightFacetL)" />
      <polygon points="256,256 131.3,184 133.8,209.7 235,268.1" fill="url(#yDeepFacetL)" />
      <polygon points="256,256 380.7,184 357.2,173.3 256,231.75" fill="url(#yLightFacetL)" />
      <polygon points="256,256 277,268.1 378.2,209.7 380.7,184" fill="url(#yDeepFacetL)" />
      <polygon points="256,256 235,268.1 235,385 256,400" fill="url(#yLightFacetL)" />
      <polygon points="256,256 256,400 277,385 277,268.1" fill="url(#yDeepFacetL)" />
