      <stop offset="30%" stop-color="#56D9E8" />
      <stop offset="72%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
    <linearGradient id="ruleLeftDark" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#5B9CFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5B9CFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ruleRightDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9CFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5B9CFF" stop-opacity="0" />
