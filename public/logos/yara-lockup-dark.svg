      stroke="url(#edgeDarkL)"
      stroke-width="8.5"
      stroke-linejoin="round"
    />
    <polygon
      points="256,80 408.4,168 408.4,344 256,432 103.6,344 103.6,168"
      stroke="#BAE6FD"
      stroke-opacity="0.45"
      stroke-width="2"
      stroke-linejoin="round"
