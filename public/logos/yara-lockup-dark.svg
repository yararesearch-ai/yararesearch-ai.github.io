      stroke-linejoin="round"
    />
    <circle cx="256" cy="80" r="27" fill="url(#nodeDarkL)" />
    <circle cx="408.4" cy="168" r="27" fill="url(#nodeDarkL)" />
    <circle cx="408.4" cy="344" r="27" fill="url(#nodeDarkL)" />
    <circle cx="256" cy="432" r="27" fill="url(#nodeDarkL)" />
    <circle cx="103.6" cy="344" r="27" fill="url(#nodeDarkL)" />
    <circle cx="103.6" cy="168" r="27" fill="url(#nodeDarkL)" />
